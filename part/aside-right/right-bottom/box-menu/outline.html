<div class="gm-menu-section gm-content-box-menu">
    <div class="gm-menu-title">Outline</div>

    <!-- OUTLINE SHORTHAND -->
    <div class="gm-menu-row">
        <label for="gm-outline">Outline</label>
        <input type="text" id="gm-outline" placeholder="1px solid #000">
        <script>
            (function () {
                const ACTIVE_SELECTOR = ".gm-object.gm-active";
                const input = document.getElementById("gm-outline");

                function getActiveObjects() {
                    return document.querySelectorAll(ACTIVE_SELECTOR);
                }

                function getOutlineValue() {
                    const actives = getActiveObjects();
                    if (!actives.length) return "";

                    const first = actives[0];
                    const base = first.style.outline || getComputedStyle(first).outline;

                    // multi-select check
                    if (actives.length > 1) {
                        const same = [...actives].every(el => {
                            const v = el.style.outline || getComputedStyle(el).outline;
                            return v === base;
                        });
                        if (!same) return "";
                    }

                    return base === "none" ? "" : base;
                }

                function applyOutline() {
                    const value = input.value.trim();
                    getActiveObjects().forEach(el => {
                        if (!value) {
                            el.style.removeProperty("outline");
                        } else {
                            el.style.outline = value;
                        }
                    });
                    updateUI();
                }

                function updateUI() {
                    if (document.activeElement === input) return;
                    input.value = getOutlineValue();
                }

                /* ================= EVENTS ================= */

                input.addEventListener("keydown", e => {
                    if (e.key === "Enter") applyOutline();
                });

                input.addEventListener("blur", applyOutline);

                document.addEventListener("click", e => {
                    if (e.target.closest(ACTIVE_SELECTOR)) {
                        requestAnimationFrame(updateUI);
                    } else {
                        requestAnimationFrame(updateUI); // deselect → kosong
                    }
                }, true);

                document.addEventListener("gm-selection-change", () => {
                    requestAnimationFrame(updateUI);
                });

                /* observer hanya untuk sinkron UI */
                window.addEventListener('gm-active-tick', updateUI);

                updateUI();
            })();
        </script>
    </div>
