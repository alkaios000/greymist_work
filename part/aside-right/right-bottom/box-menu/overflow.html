<div class="gm-menu-section gm-content-box-menu">
    <div class="gm-menu-title">Overflow & Visibility</div>

    <!-- OVERFLOW SHORTHAND -->
    <div class="gm-menu-row">
        <label for="gm-overflow">Overflow</label>
        <select id="gm-overflow">
            <option value="">-</option>
            <option value="visible">Visible</option>
            <option value="hidden">Hidden</option>
            <option value="scroll">Scroll</option>
            <option value="auto">Auto</option>
            <option value="clip">Clip</option>
        </select>
        <script>
            (function () {
                const ACTIVE_SELECTOR = ".gm-object.gm-active";
                const select = document.getElementById("gm-overflow");

                function getActiveObjects() {
                    return document.querySelectorAll(ACTIVE_SELECTOR);
                }

                function getOverflow() {
                    const actives = getActiveObjects();
                    if (!actives.length) return "";

                    const first = actives[0];
                    const base =
                        first.style.overflow ||
                        getComputedStyle(first).overflow;

                    // multi-select check
                    if (actives.length > 1) {
                        const same = [...actives].every(el => {
                            const v =
                                el.style.overflow ||
                                getComputedStyle(el).overflow;
                            return v === base;
                        });
                        if (!same) return "";
                    }

                    return base;
                }

                function applyOverflow() {
                    const value = select.value;
                    getActiveObjects().forEach(el => {
                        if (!value) {
                            el.style.removeProperty("overflow");
                        } else {
                            el.style.overflow = value;
                        }
                    });
                    updateUI();
                }

                function updateUI() {
                    if (document.activeElement === select) return;
                    select.value = getOverflow();
                }

                /* ================= EVENTS ================= */

                select.addEventListener("change", applyOverflow);

                document.addEventListener("click", () => {
                    requestAnimationFrame(updateUI);
                }, true);

                document.addEventListener("gm-selection-change", () => {
                    requestAnimationFrame(updateUI);
                });

                window.addEventListener('gm-active-tick', updateUI);

                updateUI();
            })();
        </script>
    </div>
