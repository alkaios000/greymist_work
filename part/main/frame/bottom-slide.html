<script>
    (function () {

        const btn = document.getElementById('gm-hide-attribute-frame');
        const panel = document.querySelector('.gm-object-attribute');
        const icon = btn ? btn.querySelector('i') : null;

        if (!btn || !panel || !icon) return;

        // default state: tenggelam
        let isShown = false;

        // set posisi awal (aman kalau CSS belum jalan)
        panel.style.transform = 'translateY(100%)';
        icon.classList.remove('fa-angle-down');
        icon.classList.add('fa-angle-up');

        btn.addEventListener('click', function () {

            isShown = !isShown;

            if (isShown) {
                // naik ke atas
                panel.style.transform = 'translateY(0)';
                icon.classList.remove('fa-angle-up');
                icon.classList.add('fa-angle-down');
            } else {
                // turun lagi
                panel.style.transform = 'translateY(100%)';
                icon.classList.remove('fa-angle-down');
                icon.classList.add('fa-angle-up');
            }

        });

    })();
</script>
