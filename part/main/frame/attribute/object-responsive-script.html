<script>
(function() {
    // State internal
    let currentScope = 'frame'; // 'frame' atau 'project'
    let currentFrameId = 0;
    let frameJsStore = {};
    let projectJsStore = '';
    const projId = new URLSearchParams(location.search).get("project_id") || "0";

    // Templates JS Siap Pakai
    const jsTemplates = {
        hamburger: `// Toggle Hamburger Menu Interaktif
document.addEventListener('click', function(e) {
    const btn = e.target.closest('.gm-hamburger-btn');
    const drawer = document.querySelector('.gm-mobile-drawer, aside.gm-mobile-drawer');
    if (btn) {
        e.preventDefault();
        e.stopPropagation();
        if (drawer) {
            drawer.classList.toggle('gm-menu-open');
        }
    } else if (drawer && drawer.classList.contains('gm-menu-open')) {
        if (!drawer.contains(e.target)) {
            drawer.classList.remove('gm-menu-open');
        }
    }
});`,
        modal: `// Modal Dialog Open & Close
document.querySelectorAll('[data-gm-toggle="modal"]').forEach(function(btn) {
    btn.addEventListener('click', function() {
        const targetId = this.getAttribute('data-gm-target');
        const modal = document.querySelector(targetId);
        if (modal) {
            modal.style.display = (modal.style.display === 'none' || !modal.style.display) ? 'flex' : 'none';
        }
    });
});`,
        scroll: `// Smooth Scroll untuk Navigasi Internal
document.querySelectorAll('a[href^="#"]').forEach(function(anchor) {
    anchor.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        if (href && href !== '#') {
            const el = document.querySelector(href);
            if (el) {
                e.preventDefault();
                el.scrollIntoView({ behavior: 'smooth' });
            }
        }
    });
});`,
        accordion: `// Accordion FAQ / Dropdown
document.querySelectorAll('.gm-accordion-header').forEach(function(hdr) {
    hdr.addEventListener('click', function() {
        const body = this.nextElementSibling;
        if (body) {
            body.style.display = (body.style.display === 'block') ? 'none' : 'block';
        }
    });
});`
    };

    // Fungsi Render Daftar Breakpoints Halaman
    function renderPageBreakpointList() {
        const listEl = document.getElementById('gm-resp-bp-list');
        if (!listEl) return;
        listEl.innerHTML = '';

        const bps = window.gmBreakpoints || [];
        bps.forEach(bp => {
            const item = document.createElement('div');
            item.className = 'gm-bp-item' + (window.gmActiveBreakpoint === bp.id ? ' active' : '');
            
            let icon = 'fa-desktop';
            if (bp.widthValue <= 480) icon = 'fa-mobile-alt';
            else if (bp.widthValue <= 1024) icon = 'fa-tablet-alt';

            const isDefault = bp.isDefault || bp.id === 'desktop';

            item.innerHTML = `
                <div class="gm-bp-item-info">
                    <i class="fas ${icon}" style="color: #64748b; font-size: 0.9em;"></i>
                    <span style="font-weight: 600;">${bp.name || 'Custom'}</span>
                    <span style="color: #64748b; font-size: 0.85em;">(${bp.rule})</span>
                </div>
                <div class="gm-bp-item-actions">
                    <button class="gm-bp-btn-sm switch" title="Aktifkan tampilan ini">Lihat</button>
                    ${!isDefault ? `<button class="gm-bp-btn-sm del" title="Hapus breakpoint"><i class="fas fa-times"></i></button>` : ''}
                </div>
            `;

            item.querySelector('.switch').addEventListener('click', () => {
                if (typeof window.switchBreakpoint === 'function') {
                    window.switchBreakpoint(bp.id);
                    renderPageBreakpointList();
                }
            });

            const delBtn = item.querySelector('.del');
            if (delBtn) {
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.gmBreakpoints = window.gmBreakpoints.filter(b => b.id !== bp.id);
                    if (window.gmActiveBreakpoint === bp.id && typeof window.switchBreakpoint === 'function') {
                        window.switchBreakpoint('desktop');
                    }
                    if (typeof window.renderBreakpointUI === 'function') window.renderBreakpointUI();
                    renderPageBreakpointList();
                    saveBreakpointsToCurrentFrame(false);
                });
            }

            listEl.appendChild(item);
        });
    }

    // Fungsi Simpan Breakpoint ke Frame Aktif
    function saveBreakpointsToCurrentFrame(applyToAll = false) {
        if (!currentFrameId) {
            const activeCore = document.querySelector('.gm-object-core.actived');
            if (activeCore) currentFrameId = parseInt(activeCore.dataset.frame) || 0;
        }

        const bpJson = JSON.stringify(window.gmBreakpoints || []);

        // Update DOM dataset
        const activeCore = document.getElementById(`object-core-${currentFrameId}`);
        if (activeCore) {
            activeCore.dataset.customBreakpoints = bpJson;
        }

        if (applyToAll) {
            document.querySelectorAll('.gm-object-core').forEach(c => {
                c.dataset.customBreakpoints = bpJson;
            });
        }

        // Simpan ke database via AJAX
        fetch('index.php?action=save_frame_script', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                frame_id: currentFrameId,
                project_id: projId,
                scope: 'frame',
                custom_breakpoints: bpJson,
                apply_to_all: applyToAll ? 1 : 0
            })
        })
        .then(r => r.json())
        .then(res => {
            if (res.success) {
                const btn = applyToAll ? document.getElementById('gm-resp-btn-apply-all-bp') : document.getElementById('gm-resp-btn-save-bp');
                if (btn) {
                    const orig = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-check"></i> Tersimpan!';
                    setTimeout(() => btn.innerHTML = orig, 1500);
                }
            }
        })
        .catch(console.error);
    }

    // Load Script Frame dari Server / DOM
    function loadScriptsForCurrentFrame(frameId) {
        currentFrameId = frameId;
        const activeCore = document.getElementById(`object-core-${frameId}`);
        const pageNameEl = document.getElementById('gm-resp-page-name');
        
        if (activeCore) {
            const thumbName = document.querySelector(`.gm-frame-thumbnail[data-frame="${frameId}"] .gm-frame-name`);
            if (pageNameEl) pageNameEl.textContent = thumbName ? thumbName.textContent : `Frame #${frameId}`;

            // Breakpoints per frame
            if (activeCore.dataset.customBreakpoints) {
                try {
                    const parsed = JSON.parse(activeCore.dataset.customBreakpoints);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        window.gmBreakpoints = parsed;
                        if (typeof window.renderBreakpointUI === 'function') window.renderBreakpointUI();
                    }
                } catch(e) {}
            }

            // Custom JS per frame
            frameJsStore[frameId] = activeCore.dataset.customJs || '';
        }

        renderPageBreakpointList();
        updateEditorContent();
    }

    function updateEditorContent() {
        const textarea = document.getElementById('gm-custom-js-input');
        if (!textarea) return;
        if (currentScope === 'frame') {
            textarea.value = frameJsStore[currentFrameId] || '';
            textarea.placeholder = `// JavaScript khusus untuk halaman ini (Frame #${currentFrameId})...\n// Script otomatis dijalankan saat pengunjung membuka halaman ini.`;
        } else {
            textarea.value = projectJsStore || '';
            textarea.placeholder = `// JavaScript Global untuk SELURUH halaman proyek...\n// Script ini dieksekusi di setiap halaman proyek Anda.`;
        }
    }

    // Jalankan script di canvas dengan aman
    function executeScriptInCanvas(scriptCode) {
        if (!scriptCode || !scriptCode.trim()) return;
        try {
            const activeCore = document.getElementById(`object-core-${currentFrameId}`) || document.querySelector('.gm-object-core.actived');
            const runFn = new Function('core', 'document', 'window', `
                try {
                    ${scriptCode}
                } catch(err) {
                    console.warn('[Greymist Custom JS Runtime Error]', err);
                }
            `);
            runFn(activeCore, document, window);
        } catch(e) {
            console.warn('[Greymist Custom JS Syntax Error]', e);
        }
    }

    // Inisialisasi Event Handlers
    document.addEventListener('DOMContentLoaded', function() {
        // Switch Scope: Page vs Project
        const pageBtn = document.getElementById('gm-js-scope-page');
        const projBtn = document.getElementById('gm-js-scope-proj');
        const textarea = document.getElementById('gm-custom-js-input');

        if (pageBtn && projBtn) {
            pageBtn.addEventListener('click', () => {
                currentScope = 'frame';
                pageBtn.classList.add('active');
                projBtn.classList.remove('active');
                updateEditorContent();
            });
            projBtn.addEventListener('click', () => {
                currentScope = 'project';
                projBtn.classList.add('active');
                pageBtn.classList.remove('active');
                updateEditorContent();
            });
        }

        if (textarea) {
            textarea.addEventListener('input', () => {
                if (currentScope === 'frame') {
                    frameJsStore[currentFrameId] = textarea.value;
                    const core = document.getElementById(`object-core-${currentFrameId}`);
                    if (core) core.dataset.customJs = textarea.value;
                } else {
                    projectJsStore = textarea.value;
                }
            });
        }

        // Template Pills
        document.querySelectorAll('.gm-js-tpl-pill').forEach(pill => {
            pill.addEventListener('click', function() {
                const tplKey = this.dataset.tpl;
                const snippet = jsTemplates[tplKey];
                if (snippet && textarea) {
                    if (textarea.value.trim() !== '') {
                        textarea.value += '\n\n' + snippet;
                    } else {
                        textarea.value = snippet;
                    }
                    textarea.dispatchEvent(new Event('input'));
                }
            });
        });

        // Jalankan Script
        const runBtn = document.getElementById('gm-btn-run-js');
        if (runBtn) {
            runBtn.addEventListener('click', () => {
                const code = textarea ? textarea.value : '';
                executeScriptInCanvas(code);
                const orig = runBtn.innerHTML;
                runBtn.innerHTML = '<i class="fas fa-check" style="color: #10b981;"></i> Berjalan!';
                setTimeout(() => runBtn.innerHTML = orig, 1200);
            });
        }

        // Bersihkan Script
        const clearBtn = document.getElementById('gm-btn-clear-js');
        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                if (confirm('Kosongkan editor script ini?')) {
                    if (textarea) {
                        textarea.value = '';
                        textarea.dispatchEvent(new Event('input'));
                    }
                }
            });
        }

        // Simpan Script ke Database
        const saveJsBtn = document.getElementById('gm-btn-save-js');
        if (saveJsBtn) {
            saveJsBtn.addEventListener('click', () => {
                const code = textarea ? textarea.value : '';
                saveJsBtn.disabled = true;
                saveJsBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

                fetch('index.php?action=save_frame_script', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        frame_id: currentFrameId,
                        project_id: projId,
                        scope: currentScope,
                        custom_js: code
                    })
                })
                .then(r => r.json())
                .then(res => {
                    saveJsBtn.disabled = false;
                    if (res.success) {
                        saveJsBtn.innerHTML = '<i class="fas fa-check"></i> Tersimpan!';
                        executeScriptInCanvas(code);
                        setTimeout(() => {
                            saveJsBtn.innerHTML = '<i class="fas fa-save"></i> Simpan Script';
                        }, 1500);
                    } else {
                        saveJsBtn.innerHTML = '<i class="fas fa-times"></i> Gagal';
                        setTimeout(() => {
                            saveJsBtn.innerHTML = '<i class="fas fa-save"></i> Simpan Script';
                        }, 1500);
                    }
                })
                .catch(err => {
                    saveJsBtn.disabled = false;
                    saveJsBtn.innerHTML = '<i class="fas fa-save"></i> Simpan Script';
                    console.error(err);
                });
            });
        }

        // Tambah Breakpoint Baru untuk Halaman Ini
        const addBpBtn = document.getElementById('gm-resp-btn-add-bp');
        if (addBpBtn) {
            addBpBtn.addEventListener('click', () => {
                const type = document.getElementById('gm-resp-add-type').value;
                const pxVal = parseInt(document.getElementById('gm-resp-add-px').value);
                if (!pxVal || pxVal < 240) {
                    alert('Masukkan ukuran pixel yang valid (minimal 240px).');
                    return;
                }

                const newBp = {
                    id: 'custom-' + Date.now(),
                    name: pxVal <= 480 ? 'Mobile' : (pxVal <= 1024 ? 'Tablet' : 'Desktop Custom'),
                    rule: type === 'max' ? `max-width: ${pxVal}px` : `min-width: ${pxVal}px`,
                    widthValue: pxVal,
                    type: type
                };

                window.gmBreakpoints = window.gmBreakpoints || [];
                window.gmBreakpoints.push(newBp);
                if (typeof window.renderBreakpointUI === 'function') window.renderBreakpointUI();
                renderPageBreakpointList();
                saveBreakpointsToCurrentFrame(false);
                document.getElementById('gm-resp-add-px').value = '';
            });
        }

        // Simpan Breakpoint
        const saveBpBtn = document.getElementById('gm-resp-btn-save-bp');
        if (saveBpBtn) {
            saveBpBtn.addEventListener('click', () => saveBreakpointsToCurrentFrame(false));
        }

        // Terapkan Breakpoint ke Semua Halaman
        const applyAllBpBtn = document.getElementById('gm-resp-btn-apply-all-bp');
        if (applyAllBpBtn) {
            applyAllBpBtn.addEventListener('click', () => {
                if (confirm('Terapkan breakpoint halaman ini ke seluruh halaman proyek?')) {
                    saveBreakpointsToCurrentFrame(true);
                }
            });
        }

        // Generator Navbar Responsif Lengkap
        const createNavBtn = document.getElementById('gm-btn-create-resp-nav');
        if (createNavBtn) {
            createNavBtn.addEventListener('click', () => {
                const activeCore = document.getElementById(`object-core-${currentFrameId}`) || document.querySelector('.gm-object-core.actived');
                if (!activeCore) return;

                // Pastikan ada breakpoint mobile 768px di halaman
                const hasMobileBp = (window.gmBreakpoints || []).some(b => b.widthValue <= 768 && b.type === 'max');
                if (!hasMobileBp) {
                    window.gmBreakpoints.push({
                        id: 'mobile-768',
                        name: 'Mobile / Tablet',
                        rule: 'max-width: 768px',
                        widthValue: 768,
                        type: 'max'
                    });
                    if (typeof window.renderBreakpointUI === 'function') window.renderBreakpointUI();
                    renderPageBreakpointList();
                    saveBreakpointsToCurrentFrame(false);
                }

                // Buat elemen navbar responsif
                const navHtml = `
<nav class="gm-object gm-navbar" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; background: #ffffff; border-bottom: 1px solid #e2e8f0; position: relative; box-sizing: border-box; z-index: 100;">
    <div class="gm-object gm-nav-brand" style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.25em; color: #0f172a;">
        <i class="fas fa-layer-group" style="color: #0284c7;"></i> Brand Logo
    </div>
    
    <!-- Link Desktop (Otomatis sembunyi di tablet/mobile) -->
    <div class="gm-object gm-nav-links" style="display: flex; align-items: center; gap: 20px;">
        <a class="gm-object" href="#" style="text-decoration: none; color: #475569; font-weight: 500; font-size: 0.95em;">Beranda</a>
        <a class="gm-object" href="#" style="text-decoration: none; color: #475569; font-weight: 500; font-size: 0.95em;">Fitur</a>
        <a class="gm-object" href="#" style="text-decoration: none; color: #475569; font-weight: 500; font-size: 0.95em;">Harga</a>
        <a class="gm-object" href="#" style="text-decoration: none; color: #475569; font-weight: 500; font-size: 0.95em;">Kontak</a>
    </div>

    <!-- Tombol Hamburger (Tampil di tablet/mobile) -->
    <button class="gm-object gm-hamburger-btn" style="display: none; align-items: center; justify-content: center; width: 40px; height: 40px; min-height: 40px; max-height: 40px; padding: 0px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; color: #1e293b; font-size: 18px;" aria-label="Toggle Menu">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Mobile Drawer (Dropdown menu saat hamburger diklik) -->
    <div class="gm-object gm-mobile-drawer" style="display: none; position: absolute; top: 100%; left: 0; width: 100%; background: #ffffff; border-bottom: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); flex-direction: column; padding: 16px 24px; gap: 12px; box-sizing: border-box;">
        <a class="gm-object" href="#" style="text-decoration: none; color: #1e293b; font-weight: 500; padding: 6px 0;">Beranda</a>
        <a class="gm-object" href="#" style="text-decoration: none; color: #1e293b; font-weight: 500; padding: 6px 0;">Fitur</a>
        <a class="gm-object" href="#" style="text-decoration: none; color: #1e293b; font-weight: 500; padding: 6px 0;">Harga</a>
        <a class="gm-object" href="#" style="text-decoration: none; color: #1e293b; font-weight: 500; padding: 6px 0;">Kontak</a>
    </div>
</nav>`.trim();

                const temp = document.createElement('div');
                temp.innerHTML = navHtml;
                const newNav = temp.firstElementChild;
                activeCore.prepend(newNav);

                if (typeof window.initLoadedObjects === 'function') {
                    window.initLoadedObjects(newNav);
                }

                // Pasang CSS responsif
                let styleTag = document.getElementById('gm-hamburger-style');
                if (!styleTag) {
                    styleTag = document.createElement('style');
                    styleTag.id = 'gm-hamburger-style';
                    styleTag.textContent = `
@media (max-width: 768px) {
    .gm-navbar .gm-nav-links { display: none !important; }
    .gm-navbar .gm-hamburger-btn { display: flex !important; align-items: center; justify-content: center; }
}
                    `;
                    document.head.appendChild(styleTag);
                }

                // Otomatis pasang script toggle
                const snippet = jsTemplates.hamburger;
                if (textarea && !textarea.value.includes('.gm-hamburger-btn')) {
                    textarea.value = (textarea.value.trim() ? textarea.value + '\n\n' : '') + snippet;
                    textarea.dispatchEvent(new Event('input'));
                    executeScriptInCanvas(textarea.value);
                }

                alert('Navbar responsif berhasil ditambahkan di bagian atas halaman!');
            });
        }

        // Pasang Hamburger pada Elemen Terpilih
        const convertBtn = document.getElementById('gm-btn-convert-hamburger');
        if (convertBtn) {
            convertBtn.addEventListener('click', () => {
                const selected = document.querySelector('.gm-object.selected, .gm-object.actived');
                if (!selected) {
                    alert('Silakan klik dan pilih elemen Navbar atau Header terlebih dahulu di canvas!');
                    return;
                }

                if (!selected.querySelector('.gm-hamburger-btn')) {
                    const btn = document.createElement('button');
                    btn.className = 'gm-object gm-hamburger-btn';
                    btn.setAttribute('style', 'display: none; align-items: center; justify-content: center; width: 40px; height: 40px; min-height: 40px; max-height: 40px; padding: 0px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; color: #1e293b; font-size: 18px;');
                    btn.innerHTML = '<i class="fas fa-bars"></i>';
                    selected.appendChild(btn);

                    if (typeof window.initLoadedObjects === 'function') {
                        window.initLoadedObjects(btn);
                    }
                    alert('Tombol hamburger berhasil disisipkan ke elemen terpilih!');
                } else {
                    alert('Elemen ini sudah memiliki tombol hamburger.');
                }
            });
        }

        // Pasang Script Toggle JS
        const insertNavScriptBtn = document.getElementById('gm-btn-insert-nav-script');
        if (insertNavScriptBtn) {
            insertNavScriptBtn.addEventListener('click', () => {
                if (textarea) {
                    const snippet = jsTemplates.hamburger;
                    if (!textarea.value.includes('.gm-hamburger-btn')) {
                        textarea.value = (textarea.value.trim() ? textarea.value + '\n\n' : '') + snippet;
                        textarea.dispatchEvent(new Event('input'));
                    }
                    executeScriptInCanvas(textarea.value);
                    alert('Script interaksi Hamburger Toggle berhasil dipasang dan diaktifkan!');
                }
            });
        }
    });

    // Tangkap Event Pergantian Frame
    document.addEventListener('gm-frame-switched', function(e) {
        const fid = e.detail && e.detail.frameId ? e.detail.frameId : 0;
        if (fid > 0) {
            loadScriptsForCurrentFrame(fid);
            // Jalankan script halaman jika ada
            const core = document.getElementById(`object-core-${fid}`);
            if (core && core.dataset.customJs) {
                executeScriptInCanvas(core.dataset.customJs);
            }
        }
    });

    // Ekspos method ke global untuk interaksi AI atau plugin
    const syncNavAllBtn = document.getElementById("gm-btn-sync-navbar-all");
    if (syncNavAllBtn) {
        syncNavAllBtn.addEventListener("click", () => {
            if (window.gmSyncNavbarEngine) window.gmSyncNavbarEngine.openModal();
        });
    }

    window.gmLoadFrameScripts = loadScriptsForCurrentFrame;
    window.gmExecuteCustomScript = executeScriptInCanvas;
})();
</script>
