<style>
    .gm-attribute-hidden {
        display: none !important;

    }
</style>

<script>
    // ==========================================
    // CENTRALIZED ACTIVE OBJECT POLLING (CHANGE-AWARE)
    // ==========================================
    (function() {
        let lastActiveObj = null;
        let lastActiveCount = -1;
        let lastStyle = "";

        function centralActiveWatch() {
            // Hanya dispatch gm-active-tick jika active object, jumlah seleksi, atau style inline-nya benar-benar berubah
            const active = document.querySelector('.gm-object.gm-active');
            const count = document.querySelectorAll('.gm-object.gm-active').length;
            const currentStyle = active ? (active.getAttribute('style') || "") : "";

            if (active !== lastActiveObj || count !== lastActiveCount || currentStyle !== lastStyle) {
                lastActiveObj = active;
                lastActiveCount = count;
                lastStyle = currentStyle;
                window.dispatchEvent(new CustomEvent('gm-active-tick'));
            }
            requestAnimationFrame(centralActiveWatch);
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', centralActiveWatch);
        } else {
            centralActiveWatch();
        }
    })();
</script>
<script>
    (function () {

        function initAttributePanel() {

            const containers = {
                global: document.querySelector('.gm-global-attribute-container'),
                anchor: document.querySelector('.gm-anchor-attribute-container'),
                input: document.querySelector('.gm-input-attribute-container'),
                form: document.querySelector('.gm-form-attribute-container'),
                select: document.querySelector('.gm-selectoption-attribute-container'),
                list: document.querySelector('.gm-list-attribute-container'),
                text: document.querySelector('.gm-text-attribute-container'),
                image: document.querySelector('.gm-image-attribute-container'),
                table: document.querySelector('.gm-table-attribute-container'),
                textarea: document.querySelector('.gm-textarea-attribute-container'),
                audiovideo: document.querySelector('.gm-audiovideo-attribute-container')
            };

            const tagMap = {
                div: 'global',
                a: 'anchor',
                input: 'input',
                form: 'form',
                select: 'select',
                option: 'select',
                ul: 'list',
                ol: 'list',
                li: 'list',
                p: 'text',
                span: 'text',
                label: 'text',
                strong: 'text',
                em: 'text',
                small: 'text',
                h1: 'text',
                h2: 'text',
                h3: 'text',
                h4: 'text',
                h5: 'text',
                h6: 'text',
                img: 'image',
                table: 'table',
                thead: 'table',
                tbody: 'table',
                tr: 'table',
                td: 'table',
                th: 'table',
                textarea: 'textarea',
                audio: 'audiovideo',
                video: 'audiovideo'
            };

            let lastActive = null;

            function hideAllSpecific() {
                Object.keys(containers).forEach(key => {
                    if (key !== 'global' && containers[key]) {
                        containers[key].classList.add('gm-attribute-hidden');
                        containers[key].style.display = 'none';
                    }
                });
            }

            function showGlobal() {
                if (containers.global) {
                    containers.global.classList.remove('gm-attribute-hidden');
                    containers.global.style.display = 'block';
                }
            }

            function updatePanel() {

                // 🔥 Ambil core yang sedang actived
                const activeCore = document.querySelector('.gm-object-core.actived');
                if (!activeCore) {
                    hideAllSpecific();
                    showGlobal();
                    return;
                }

                const activeObject = activeCore.querySelector('.gm-object.gm-active');

                if (activeObject === lastActive) return;
                lastActive = activeObject;

                hideAllSpecific();
                showGlobal();

                if (!activeObject) return;

                // Handle wrapper gm-object
                let realElement = activeObject;

                if (
                    activeObject.children.length === 1 &&
                    activeObject.firstElementChild instanceof HTMLElement
                ) {
                    realElement = activeObject.firstElementChild;
                }

                const tag = realElement.tagName.toLowerCase();
                const key = tagMap[tag];

                if (!key) return; // tag tidak terdaftar → hanya global

                const container = containers[key];

                if (container) {
                    container.classList.remove('gm-attribute-hidden');
                    container.style.display = 'block';
                }
            }

            function watch() {
                updatePanel();
                // requestAnimationFrame(watch); replaced by centralized event
            }

            window.addEventListener('gm-active-tick', watch);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAttributePanel);
        } else {
            initAttributePanel();
        }

    })();
</script>

<div class="gm-global-attribute-container gm-menu-section" style="width: 250px; padding: 0;">

            <label for="gm-attr-id">Id (selector)</label>
            <input type="text" id="gm-attr-id" class="gm-attr-id" placeholder="">
            <script>
                // ===============================
                // GLOBAL ATTRIBUTE - ID HANDLER
                // ===============================

                const idInput = document.querySelector('.gm-attr-id');

                let lastActiveObject = null;

                // -------------------------------
                // GET ACTIVE OBJECT
                // -------------------------------
                function getActiveObject() {
                    const activeCore = document.querySelector('.gm-object-core.actived');
                    if (!activeCore) return null;

                    return activeCore.querySelector('.gm-object.gm-active');
                }

                // -------------------------------
                // SANITIZE ID
                // -------------------------------
                function sanitizeId(value) {
                    return value
                        .trim()
                        .replace(/\s+/g, '-')       // spasi → dash
                        .replace(/[^a-zA-Z0-9\-_]/g, ''); // hanya karakter valid
                }

                // -------------------------------
                // WATCH ACTIVE OBJECT
                // -------------------------------
                function watchActiveObject() {
                    const activeObject = getActiveObject();

                    if (activeObject !== lastActiveObject) {
                        lastActiveObject = activeObject;

                        if (activeObject) {
                            idInput.value = activeObject.id || '';
                            idInput.disabled = false;
                        } else {
                            idInput.value = '';
                            idInput.disabled = true;
                        }
                    }

                    // requestAnimationFrame(watchActiveObject); replaced by centralized event
                }

                window.addEventListener('gm-active-tick', watchActiveObject);

                // -------------------------------
                // HANDLE INPUT REALTIME
                // -------------------------------
                idInput.addEventListener('input', () => {
                    const activeObject = getActiveObject();
                    if (!activeObject) return;

                    const sanitized = sanitizeId(idInput.value);
                    idInput.value = sanitized;

                    if (sanitized === '') {
                        activeObject.removeAttribute('id');
                        idInput.classList.remove('gm-error');
                        return;
                    }

                    // Cek duplicate ID
                    const duplicate = document.querySelector(`#${CSS.escape(sanitized)}`);

                    if (duplicate && duplicate !== activeObject) {
                        idInput.classList.add('gm-error');
                        return;
                    }

                    idInput.classList.remove('gm-error');
                    activeObject.id = sanitized;
                });
            </script>

        <div>
            <label for="gm-attr-class">Class (selector)</label>
            <input type="text" id="gm-attr-class" class="gm-attr-class" placeholder="">
            <script>
                // ========================================
                // GM ATTRIBUTE PANEL - CLASS (SAFE MODE)
                // ========================================
                (function () {

                    const gmAttrClass_input = document.querySelector('.gm-attr-class');
                    if (!gmAttrClass_input) return;

                    const gmAttrClass_systemClasses = [
                        'gm-object',
                        'gm-active',
                        'hover-core'
                    ];

                    let gmAttrClass_lastActive = null;

                    // ------------------------------------
                    // GET ACTIVE OBJECT
                    // ------------------------------------
                    function gmAttrClass_getActiveObject() {
                        const core = document.querySelector('.gm-object-core.actived');
                        if (!core) return null;
                        return core.querySelector('.gm-object.gm-active');
                    }

                    // ------------------------------------
                    // FILTER USER CLASSES (hide system)
                    // ------------------------------------
                    function gmAttrClass_getUserClasses(element) {
                        return Array.from(element.classList)
                            .filter(cls => !gmAttrClass_systemClasses.includes(cls))
                            .join(' ');
                    }

                    // ------------------------------------
                    // WATCH ACTIVE OBJECT
                    // ------------------------------------
                    function gmAttrClass_watch() {
                        const active = gmAttrClass_getActiveObject();

                        if (active !== gmAttrClass_lastActive) {
                            gmAttrClass_lastActive = active;

                            if (active) {
                                gmAttrClass_input.value =
                                    gmAttrClass_getUserClasses(active);

                                gmAttrClass_input.disabled = false;
                            } else {
                                gmAttrClass_input.value = '';
                                gmAttrClass_input.disabled = true;
                            }
                        }

                        // requestAnimationFrame(gmAttrClass_watch); replaced by centralized event
                    }

                    window.addEventListener('gm-active-tick', gmAttrClass_watch);

                    // ------------------------------------
                    // HANDLE INPUT (NO TRIM, NO SPACE BUG)
                    // ------------------------------------
                    gmAttrClass_input.addEventListener('input', function () {

                        const active = gmAttrClass_getActiveObject();
                        if (!active) return;

                        // Ambil class system dulu
                        const system = gmAttrClass_systemClasses.filter(cls =>
                            active.classList.contains(cls)
                        );

                        // Ambil user input TANPA trim
                        const userClasses = this.value
                            .replace(/\s+/g, ' ') // rapikan double space
                            .split(' ')
                            .filter(Boolean);

                        // Gabungkan system + user
                        const finalClassList = [...system, ...userClasses];

                        active.className = finalClassList.join(' ');
                    });

                })();
            </script>
