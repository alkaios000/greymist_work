<!-- NOT CLEAR -->
<div class="gm-display-panel gm-menu-section" data-display="block">
    <div class="gm-menu-title">Block</div>

    <div class="gm-menu-row">
        <label>Width</label>
        <input type="text" id="gm-block-width" placeholder="auto">
    </div>

    <div class="gm-menu-row">
        <label>Height</label>
        <input type="text" id="gm-block-height" placeholder="auto">
    </div>

    <div class="gm-menu-row">
        <label>Margin</label>
        <input type="text" id="gm-block-margin" placeholder="e.g. 10px or auto">
    </div>

    <div class="gm-menu-row">
        <label>Padding</label>
        <input type="text" id="gm-block-padding" placeholder="e.g. 5px 10px">
    </div>

    <div class="gm-menu-row">
        <label>Border</label>
        <input type="text" id="gm-block-border" placeholder="e.g. 1px solid #ccc">
    </div>

    <div class="gm-menu-row">
        <label>Box Sizing</label>
        <select id="gm-block-boxsizing">
            <option value="content-box">content-box</option>
            <option value="border-box">border-box</option>
        </select>
    </div>
</div>
