<!-- NOT CLEAR -->
<div class="gm-display-panel gm-menu-section" data-display="grid">
    <div class="gm-menu-title">Grid Settings</div>

    <div class="gm-menu-row">
        <!-- RIGHT: Grid Style Settings -->
        <div class="gm-menu-row">
            <label>Template Rows</label>
            <input type="text" id="gm-grid-template-rows" placeholder="e.g. 1fr 2fr 1fr">
        </div>

        <div class="gm-menu-row">
            <label>Template Columns</label>
            <input type="text" id="gm-grid-template-cols" placeholder="e.g. 1fr 1fr 1fr">
        </div>

        <div class="gm-menu-row">
            <label>Justify Items</label>
            <select id="gm-grid-justify-items">
                <option>stretch</option>
                <option>start</option>
                <option>center</option>
                <option>end</option>
            </select>
        </div>

        <div class="gm-menu-row">
            <label>Align Items</label>
            <select id="gm-grid-align-items">
                <option>stretch</option>
                <option>start</option>
                <option>center</option>
                <option>end</option>
            </select>
        </div>

        <div class="gm-menu-row">
            <label>Justify Content</label>
            <select id="gm-grid-justify-content">
                <option>start</option>
                <option>center</option>
                <option>end</option>
                <option>space-between</option>
                <option>space-around</option>
            </select>
        </div>

        <div class="gm-menu-row">
            <label>Align Content</label>
            <select id="gm-grid-align-content">
                <option>start</option>
                <option>center</option>
                <option>end</option>
                <option>space-between</option>
                <option>space-around</option>
            </select>
        </div>
    </div>
</div>
