<!-- NOT CLEAR -->
<div class="gm-display-panel gm-menu-section" data-display="inline">
  
  <div class="gm-menu-row">
    <div class="gm-menu-title">Inline Settings</div>
    <div class="gm-menu-row">
      <label>Vertical Align</label>
      <select id="gm-inline-vertical-align">
        <option value="baseline">baseline</option>
        <option value="top">top</option>
        <option value="middle">middle</option>
        <option value="bottom">bottom</option>
        <option value="sub">sub</option>
        <option value="super">super</option>
      </select>
    </div>

    <div class="gm-menu-row">
      <label>White Space</label>
      <select id="gm-inline-white-space">
        <option value="normal">normal</option>
        <option value="nowrap">nowrap</option>
        <option value="pre">pre</option>
        <option value="pre-line">pre-line</option>
        <option value="pre-wrap">pre-wrap</option>
      </select>
    </div>

    <div class="gm-menu-row">
      <label>Text Align (Parent)</label>
      <select id="gm-inline-text-align">
        <option value="">(inherit)</option>
        <option value="left">left</option>
        <option value="center">center</option>
        <option value="right">right</option>
        <option value="justify">justify</option>
      </select>
    </div>

    <div class="gm-menu-row">
      <label>Overflow</label>
      <select id="gm-inline-overflow">
        <option value="visible">visible</option>
        <option value="hidden">hidden</option>
        <option value="scroll">scroll</option>
        <option value="auto">auto</option>
      </select>
    </div>

    <div class="gm-menu-row">
      <label>Line Height</label>
      <input type="number" id="gm-inline-line-height" min="0.5" max="5" step="0.1" value="1.2">
    </div>
  </div>
</div>
