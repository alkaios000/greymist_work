<!-- Modal untuk rincian ikon -->
<div id="gm-iconModal" class="gm-modal">
  <div class="gm-modal-content" id="gm-modal-content">
    <span class="gm-close">&times;</span>
    <div id="gm-modalIcon" style="font-size: 3em; margin-bottom: 10px;"></div>
    <div id="gm-modalDetails">

      <div class="gm-icon-property-cont">
        <p id="gm-modalName" style="font-size: 0.7em;"></p>
        <p id="gm-modalCategory" style="font-size: 0.7em;"></p>
      </div>

      <div class="gm-icon-code-cont">
        <pre id="gm-modalCode"></pre>
        <i class="fas fa-clone" id="gm-copyButton" style="cursor: pointer;"></i>
      </div>
      
      <!-- Notifikasi copy -->
      <div id="gm-copyNotif" class="gm-copy-notif">Kode tag berhasil disalin!</div>
    </div>
  </div>
</div>
