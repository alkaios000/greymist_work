    <div class="gm-corner-menu" id="gm-corner-menu">
        <div class="gm-project-name-cont" id="gm-project-name-cont">
            <p class="gm-project-name" id="gm-project-name"></p>
            <script>
                document.addEventListener("DOMContentLoaded", () => {

                    const nameEl = document.getElementById("gm-project-name");
                    if (!nameEl) return;

                    const params = new URLSearchParams(location.search);
                    const projectId = params.get("project_id");
                    if (!projectId) return;

                    fetch(`api/get_project.php?project_id=${projectId}`)
                        .then(r => r.json())
                        .then(res => {
                            if (res.status !== "OK") return;
                            nameEl.textContent = res.project_name;
                        });

                });

            </script>
            <i class="gm-edit-project-name far fa-pen-to-square"></i>
            <i class="gm-cloud-sync fas fa-cloud" id="gm-cloud-sync" title="Auto-Save Sync" style="margin-left: 8px; font-size: 13px; color: #4caf50; transition: color 0.3s ease;"></i>
        </div>
