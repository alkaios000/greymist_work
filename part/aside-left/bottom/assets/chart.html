<script>
(function() {
    let builtinTemplates = [];
    let userCharts = [];
    let currentTab = 'all';
    let currentLibFilter = 'all';
    let searchQuery = '';

    const listWrapper = document.getElementById('gm-charts-list-wrapper');
    const searchInput = document.getElementById('gm-chart-search-input');
    const cntAll = document.getElementById('gm-chart-cnt-all');
    const cntTmpl = document.getElementById('gm-chart-cnt-tmpl');
    const cntUser = document.getElementById('gm-chart-cnt-user');

    // Modal elements
    const modal = document.getElementById('gm-chart-creator-modal');
    const openModalBtn = document.getElementById('gm-chart-add-new-btn');
    const closeModalBtn = document.getElementById('gm-chart-modal-close-btn');
    const cancelModalBtn = document.getElementById('gm-modal-cancel-btn');
    const saveModalBtn = document.getElementById('gm-modal-save-btn');
    const previewModalBtn = document.getElementById('gm-modal-preview-btn');
    const loadStarterBtn = document.getElementById('gm-modal-load-starter-btn');

    const modalId = document.getElementById('gm-modal-chart-id');
    const modalHeading = document.getElementById('gm-modal-chart-heading');
    const modalName = document.getElementById('gm-modal-chart-name');
    const modalType = document.getElementById('gm-modal-chart-type');
    const modalLib = document.getElementById('gm-modal-chart-lib');
    const modalCdn = document.getElementById('gm-modal-chart-cdn');
    const modalCode = document.getElementById('gm-modal-chart-code');
    const modalPreview = document.getElementById('gm-modal-chart-preview-box');
    const modalStatus = document.getElementById('gm-modal-chart-status');

    // CDN Presets
    const CDN_PRESETS = {
        chartjs: 'https://cdn.jsdelivr.net/npm/chart.js',
        apexcharts: 'https://cdn.jsdelivr.net/npm/apexcharts',
        echarts: 'https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js',
        custom: ''
    };

    /**
     * Memuat script CDN ke dokumen jika belum ada
     */
    window.loadGmCdnScript = function(url) {
        return new Promise((resolve, reject) => {
            if (!url) return resolve();
            const existing = document.querySelector(`script[src="${url}"]`);
            if (existing) return resolve();

            const s = document.createElement('script');
            s.src = url;
            s.onload = () => resolve();
            s.onerror = (e) => reject(e);
            document.head.appendChild(s);
        });
    };

    /**
     * Universal Chart Engine untuk merender chart di canvas atau container
     */
    if (typeof window.initGmCharts !== 'function') {
        window.initGmCharts = async function(container) {
            const root = container || document.getElementById('gm-frame-preview') || document.body;
            const chartCards = root.querySelectorAll('.gm-chart-card');

            for (const card of chartCards) {
                const configScript = card.querySelector('script[data-gm-chart-config]');
                if (!configScript) continue;

                try {
                    const configText = configScript.textContent.trim();
                    const config = JSON.parse(configText);

                    if (config.library === 'chartjs') {
                        await window.loadGmCdnScript(config.cdn || 'https://cdn.jsdelivr.net/npm/chart.js');
                        const canvas = card.querySelector('.gm-chart-canvas') || card.querySelector('canvas');
                        if (canvas && window.Chart) {
                            if (canvas._gmChart) {
                                try { canvas._gmChart.destroy(); } catch (_) {}
                            }
                            canvas._gmChart = new window.Chart(canvas, {
                                type: config.type || 'bar',
                                data: config.data || {},
                                options: config.options || { responsive: true, maintainAspectRatio: false }
                            });
                        }
                    } else if (config.library === 'apexcharts') {
                        await window.loadGmCdnScript(config.cdn || 'https://cdn.jsdelivr.net/npm/apexcharts');
                        const apexCont = card.querySelector('.gm-apex-chart-container') || card.querySelector('div[style*="min-height"]');
                        if (apexCont && window.ApexCharts) {
                            apexCont.innerHTML = '';
                            const chart = new window.ApexCharts(apexCont, config.options || {});
                            chart.render();
                        }
                    }
                } catch (err) {
                    console.warn('[Greymist Chart Runner] Gagal menginisialisasi chart:', err);
                }
            }
        };
    }

    /**
     * Ambil data chart dari backend
     */
    async function fetchChartsData() {
        try {
            const res = await fetch('index.php?action=get_user_charts');
            const data = await res.json();
            if (data && data.success) {
                userCharts = data.charts || [];
                builtinTemplates = data.templates || [];
                window.gmUserCharts = userCharts;
                window.gmBuiltinChartTemplates = builtinTemplates;
                renderChartsList();
            }
        } catch (err) {
            listWrapper.innerHTML = `<div style="text-align: center; padding: 20px; color: #ef4444; font-size: 11px;">Gagal memuat chart: ${err.message}</div>`;
        }
    }

    /**
     * Render daftar chart pada sidebar Assets
     */
    function renderChartsList() {
        let items = [];
        if (currentTab === 'template') {
            items = builtinTemplates.map(t => ({ ...t, is_template: true }));
        } else if (currentTab === 'user') {
            items = userCharts.map(u => ({ ...u, is_template: false }));
        } else {
            items = [
                ...userCharts.map(u => ({ ...u, is_template: false })),
                ...builtinTemplates.map(t => ({ ...t, is_template: true }))
            ];
        }

        // Filter Library
        if (currentLibFilter !== 'all') {
            items = items.filter(it => (it.library_cdn || it.library) === currentLibFilter);
        }

        // Filter Search
        if (searchQuery) {
            items = items.filter(it => {
                const name = (it.chart_name || it.name || '').toLowerCase();
                const desc = (it.desc || it.category || '').toLowerCase();
                return name.includes(searchQuery) || desc.includes(searchQuery);
            });
        }

        if (cntAll) cntAll.textContent = (userCharts.length + builtinTemplates.length);
        if (cntTmpl) cntTmpl.textContent = builtinTemplates.length;
        if (cntUser) cntUser.textContent = userCharts.length;

        if (items.length === 0) {
            listWrapper.innerHTML = `
                <div style="text-align: center; padding: 32px 12px; color: #94a3b8; font-size: 11px;">
                    <i class="fa-solid fa-chart-simple" style="font-size: 26px; margin-bottom: 8px; color: #cbd5e1; display: block;"></i>
                    <strong style="color: #64748b;">Belum ada chart yang cocok</strong>
                    <p style="margin: 4px 0 0; font-size: 10px;">Gunakan tombol "+ Buat Chart" untuk membuat chart kustom pertama Anda.</p>
                </div>
            `;
            return;
        }

        listWrapper.innerHTML = items.map((item, idx) => {
            const isTmpl = item.is_template;
            const title = item.chart_name || item.name;
            const lib = item.library_cdn || item.library || 'chartjs';
            const badgeClass = `gm-badge-${lib}`;
            const libLabel = lib === 'chartjs' ? 'Chart.js' : (lib === 'apexcharts' ? 'ApexCharts' : (lib === 'echarts' ? 'ECharts' : 'Custom'));
            const typeLabel = (item.chart_type || item.type || 'bar').toUpperCase();
            const code = item.chart_code || item.code || '';
            const safeCode = encodeURIComponent(code);

            return `
                <div class="gm-chart-card-item gm-template-dropable" draggable="true" data-type="template" data-html-content="${safeCode}" data-chart-index="${idx}">
                    <div class="gm-chart-card-head">
                        <div>
                            <div class="gm-chart-card-title">${title}</div>
                            <div class="gm-chart-card-meta">${isTmpl ? 'Template Bawaan' : 'Chart Akun Saya'} &bull; ${typeLabel}</div>
                        </div>
                        <span class="gm-chart-card-badge ${badgeClass}">${libLabel}</span>
                    </div>
                    
                    <div class="gm-chart-card-actions">
                        <button type="button" class="gm-chart-action-btn gm-chart-insert-btn" onclick="insertChartToCore(decodeURIComponent('${safeCode}'))">
                            <i class="fa-solid fa-plus"></i> Sisipkan
                        </button>
                        <button type="button" class="gm-chart-action-btn" onclick="copyChartHtml(decodeURIComponent('${safeCode}'))" title="Salin Kode HTML">
                            <i class="fa-solid fa-copy"></i> Salin
                        </button>
                        ${isTmpl ? `
                            <button type="button" class="gm-chart-action-btn" onclick="openCloneModal('${item.id}')" title="Kustomisasi & Simpan ke Akun">
                                <i class="fa-solid fa-pen-to-square"></i> Kloning
                            </button>
                        ` : `
                            <button type="button" class="gm-chart-action-btn" onclick="openEditModal(${item.chart_id})" title="Edit Chart">
                                <i class="fa-solid fa-pen"></i> Edit
                            </button>
                            <button type="button" class="gm-chart-action-btn" style="color: #ef4444; border-color: #fecaca;" onclick="deleteChart(${item.chart_id}, '${title.replace(/'/g, "\\'")}')" title="Hapus dari Akun">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        `}
                    </div>
                    <template>${code}</template>
                </div>
            `;
        }).join('');
    }

    /**
     * Sisipkan chart langsung ke canvas (#object-core)
     */
    window.insertChartToCore = function(htmlCode) {
        const core = document.getElementById('object-core');
        if (!core) {
            alert('Kanvas editor Greymist tidak ditemukan.');
            return;
        }

        const temp = document.createElement('div');
        temp.innerHTML = htmlCode.trim();

        // Berikan ID unik pada canvas/container agar tidak bertabrakan jika dipasang multi-chart
        const uniqueId = 'gm-chart-' + Math.random().toString(36).substr(2, 9);
        const canvas = temp.querySelector('canvas');
        if (canvas) canvas.id = uniqueId;
        const apexDiv = temp.querySelector('.gm-apex-chart-container');
        if (apexDiv) apexDiv.id = uniqueId;

        const insertedChildren = [];
        Array.from(temp.children).forEach(child => {
            child.classList.add('gm-object');
            core.appendChild(child);
            insertedChildren.push(child);
        });

        // Jalankan runner chart
        window.initGmCharts(core);

        // Feedback visual
        if (window.showStatus) {
            window.showStatus(null, 'success', 'Chart berhasil disisipkan ke halaman!');
        }
    };

    /**
     * Salin kode chart ke clipboard
     */
    window.copyChartHtml = function(code) {
        navigator.clipboard.writeText(code).then(() => {
            alert('✓ Kode chart berhasil disalin ke clipboard!');
        }).catch(() => {
            prompt('Salin kode chart manual di bawah ini:', code);
        });
    };

    /**
     * Buka modal untuk kustomisasi template
     */
    window.openCloneModal = function(templateId) {
        const tmpl = builtinTemplates.find(t => t.id === templateId);
        if (!tmpl) return;

        modalId.value = '0';
        modalHeading.textContent = 'Kustomisasi Template Chart';
        modalName.value = tmpl.name + ' (Kustom)';
        modalType.value = tmpl.type || 'bar';
        modalLib.value = tmpl.library || 'chartjs';
        modalCdn.value = tmpl.cdn_url || CDN_PRESETS[tmpl.library] || '';
        modalCode.value = tmpl.code || '';
        modalStatus.textContent = '';
        modal.style.display = 'flex';
        renderModalPreview();
    };

    /**
     * Buka modal untuk mengedit chart tersimpan milik user
     */
    window.openEditModal = function(chartId) {
        const ch = userCharts.find(c => c.chart_id == chartId);
        if (!ch) return;

        modalId.value = ch.chart_id;
        modalHeading.textContent = 'Edit Chart Kustom: ' + ch.chart_name;
        modalName.value = ch.chart_name;
        modalType.value = ch.chart_type;
        modalLib.value = ch.library_cdn;
        modalCdn.value = ch.cdn_url;
        modalCode.value = ch.chart_code;
        modalStatus.textContent = '';
        modal.style.display = 'flex';
        renderModalPreview();
    };

    /**
     * Hapus chart dari database
     */
    window.deleteChart = async function(chartId, title) {
        if (!confirm(`Yakin ingin menghapus chart "${title}" dari akun Anda?`)) return;

        try {
            const resp = await fetch('index.php?action=delete_user_chart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chart_id: chartId })
            });
            const res = await resp.json();
            if (res && res.success) {
                userCharts = userCharts.filter(c => c.chart_id != chartId);
                window.gmUserCharts = userCharts;
                renderChartsList();
            } else {
                alert(res.msg || 'Gagal menghapus chart.');
            }
        } catch (err) {
            alert('Koneksi gagal: ' + err.message);
        }
    };

    /**
     * Render live preview di dalam modal
     */
    async function renderModalPreview() {
        const code = modalCode.value.trim();
        if (!code) {
            modalPreview.innerHTML = '<span style="font-size: 11px; color: #94a3b8;">Kode chart masih kosong.</span>';
            return;
        }

        modalPreview.innerHTML = code;
        await window.initGmCharts(modalPreview);
    }

    /**
     * Muat boilerplate starter untuk library CDN yang dipilih
     */
    function loadStarterTemplate() {
        const lib = modalLib.value;
        const type = modalType.value;

        if (lib === 'apexcharts') {
            modalCode.value = `<div class="gm-object gm-chart-card" data-chart-type="${type}" data-chart-lib="apexcharts" style="width: 100%; max-width: 600px; padding: 20px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; margin: 16px auto; font-family: 'Inter', sans-serif;">
    <h4 class="gm-object" style="margin: 0 0 16px 0; font-size: 16px; font-weight: 700; color: #0f172a;">Judul Chart ApexCharts</h4>
    <div class="gm-object gm-apex-chart-container" style="min-height: 280px; width: 100%;"></div>
    <script data-gm-chart-config="true">
    {
        "library": "apexcharts",
        "cdn": "https://cdn.jsdelivr.net/npm/apexcharts",
        "options": {
            "chart": { "type": "${type === 'radar' || type === 'radialBar' ? type : 'area'}", "height": 280, "toolbar": { "show": false } },
            "colors": ["#0078ff", "#10b981"],
            "series": [
                { "name": "Metrik A", "data": [30, 40, 35, 50, 49, 60, 70, 91, 125] },
                { "name": "Metrik B", "data": [20, 30, 25, 40, 39, 45, 55, 65, 80] }
            ],
            "xaxis": { "categories": ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep"] }
        }
    }
    <\/script>
</div>`;
        } else {
            modalCode.value = `<div class="gm-object gm-chart-card" data-chart-type="${type}" data-chart-lib="chartjs" style="width: 100%; max-width: 600px; padding: 20px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; margin: 16px auto; font-family: 'Inter', sans-serif;">
    <h4 class="gm-object" style="margin: 0 0 16px 0; font-size: 16px; font-weight: 700; color: #0f172a;">Judul Chart Kustom</h4>
    <div class="gm-object gm-chart-canvas-wrap" style="position: relative; width: 100%; height: 280px;">
        <canvas class="gm-object gm-chart-canvas"></canvas>
    </div>
    <script data-gm-chart-config="true">
    {
        "library": "chartjs",
        "cdn": "https://cdn.jsdelivr.net/npm/chart.js",
        "type": "${type}",
        "data": {
            "labels": ["Kategori 1", "Kategori 2", "Kategori 3", "Kategori 4", "Kategori 5"],
            "datasets": [
                {
                    "label": "Nilai Data",
                    "data": [65, 59, 80, 81, 56],
                    "backgroundColor": ["#3b82f6", "#10b981", "#f59e0b", "#ec4899", "#8b5cf6"]
                }
            ]
        },
        "options": {
            "responsive": true,
            "maintainAspectRatio": false
        }
    }
    <\/script>
</div>`;
        }
        renderModalPreview();
    }

    // Event Listeners
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim().toLowerCase();
            renderChartsList();
        });
    }

    document.querySelectorAll('.gm-chart-tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.gm-chart-tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentTab = this.dataset.tab;
            renderChartsList();
        });
    });

    document.querySelectorAll('.gm-chart-filter-pill').forEach(pill => {
        pill.addEventListener('click', function() {
            document.querySelectorAll('.gm-chart-filter-pill').forEach(p => p.classList.remove('active'));
            this.classList.add('active');
            currentLibFilter = this.dataset.lib;
            renderChartsList();
        });
    });

    if (openModalBtn) {
        openModalBtn.addEventListener('click', () => {
            modalId.value = '0';
            modalHeading.textContent = 'Tambah Chart Kustom Baru';
            modalName.value = '';
            modalType.value = 'bar';
            modalLib.value = 'chartjs';
            modalCdn.value = CDN_PRESETS.chartjs;
            loadStarterTemplate();
            modalStatus.textContent = '';
            modal.style.display = 'flex';
        });
    }

    if (closeModalBtn) closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
    if (cancelModalBtn) cancelModalBtn.addEventListener('click', () => modal.style.display = 'none');

    modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.style.display = 'none';
    });

    if (modalLib) {
        modalLib.addEventListener('change', () => {
            const lib = modalLib.value;
            modalCdn.value = CDN_PRESETS[lib] || '';
            loadStarterTemplate();
        });
    }

    if (modalType) {
        modalType.addEventListener('change', () => {
            loadStarterTemplate();
        });
    }

    if (loadStarterBtn) loadStarterBtn.addEventListener('click', loadStarterTemplate);
    if (previewModalBtn) previewModalBtn.addEventListener('click', renderModalPreview);

    // Simpan ke Database
    if (saveModalBtn) {
        saveModalBtn.addEventListener('click', async () => {
            const id = parseInt(modalId.value, 10) || 0;
            const name = modalName.value.trim();
            const type = modalType.value;
            const lib = modalLib.value;
            const cdn = modalCdn.value.trim();
            const code = modalCode.value.trim();

            if (!name) {
                alert('Nama chart wajib diisi.');
                modalName.focus();
                return;
            }
            if (!code) {
                alert('Kode chart tidak boleh kosong.');
                modalCode.focus();
                return;
            }

            saveModalBtn.disabled = true;
            saveModalBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
            modalStatus.textContent = 'Menyimpan ke database...';

            try {
                const resp = await fetch('index.php?action=save_user_chart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chart_id: id,
                        chart_name: name,
                        chart_type: type,
                        library_cdn: lib,
                        cdn_url: cdn,
                        chart_code: code
                    })
                });
                const res = await resp.json();
                if (res && res.success) {
                    modalStatus.style.color = '#10b981';
                    modalStatus.textContent = '✓ ' + res.msg;
                    setTimeout(() => {
                        modal.style.display = 'none';
                        fetchChartsData();
                    }, 500);
                } else {
                    modalStatus.style.color = '#ef4444';
                    modalStatus.textContent = res.msg || 'Gagal menyimpan chart.';
                }
            } catch (err) {
                modalStatus.style.color = '#ef4444';
                modalStatus.textContent = 'Koneksi error: ' + err.message;
            } finally {
                saveModalBtn.disabled = false;
                saveModalBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan ke Database';
            }
        });
    }

    // Muat data chart saat dokumen siap
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fetchChartsData);
    } else {
        fetchChartsData();
    }
})();
</script>
